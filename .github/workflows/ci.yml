name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  OFC_OFFLINE_TESTS: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_public_release.py
      - run: python scripts/verify_submission_surface.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - name: Verify registered development corpus
        run: >-
          python -m ofc_engine.control.acceptance
          --manifest tests/fixtures/control_acceptance_manifest.json
          --expected-digest "$(cat tests/fixtures/control_acceptance_lock.txt)"
      - run: python scripts/control_security_gate.py
      - run: python scripts/control_rehearsal.py
      - run: python scripts/control_canary.py
      - name: Rehearse keyless release boundary
        run: python -m scripts.rehearse_release --output release-rehearsal.json
      - name: Archive synthetic rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-release-rehearsal
          path: release-rehearsal.json
          retention-days: 7
      - run: node --check src/ofc_engine/web/copilot-tools.js && node --check src/ofc_engine/web/copilot-proof.js && node --check src/ofc_engine/web/copilot-activity.js && node --check src/ofc_engine/web/copilot-workspace.js && node --check src/ofc_engine/web/intro.js && node --check src/ofc_engine/web/app.js && node --check src/ofc_engine/web/experience.js && node --check src/ofc_engine/web/studio.js && node --check src/ofc_engine/web/product.js && node --check src/ofc_engine/web/recorded.js && node --check src/ofc_engine/web/local-run.js && node --check src/ofc_engine/web/hosted-live.js && node --check src/ofc_engine/web/hosted-preflight.js && node --check src/ofc_engine/web/hosted-tour.js && node --check src/ofc_engine/web/hosted-showcase.js && node --check src/ofc_engine/web/connect.js
  fixture_container:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ofc-fixture-preview:ci .
      - name: Smoke-test read-only container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name ofc-preview-ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18080:8000 ofc-fixture-preview:ci
          trap 'docker rm -f ofc-preview-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail --silent 'http://127.0.0.1:18080/api/demo?scenario=repair' \
            | python -c 'import json,sys; p=json.load(sys.stdin); assert p["demo_mode"]=="SYNTHETIC" and p["release_authorized"] is False and p["provider_authenticated"] is False'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:18080/api/runs)" = "405"

  durable_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ofc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ofc_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify atomic Postgres agent lifecycle
        env:
          OFC_TEST_POSTGRES_URL: postgresql://postgres:ci-only@127.0.0.1:5432/ofc_ci
        run: python -m pytest tests/test_postgres_runtime.py tests/test_control_runtime.py
      - name: Check control benchmark and standalone verifier
        run: python -m ofc_engine.control.benchmark
