name: preview browser qualification
on:
  pull_request:
    paths:
      - ".github/workflows/preview-browser.yml"
      - "scripts/browser_smoke.py"
      - "scripts/smoke_recorded_browser.py"
      - "scripts/capture_ui.py"
      - "scripts/accessibility_smoke.py"
      - "scripts/bench_preview.py"
      - "scripts/smoke_hosted.py"
      - "src/ofc_engine/hosted_preview.py"
      - "src/ofc_engine/web/**"
      - "src/ofc_engine/webdemo.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser requirements
        run: |
          python -m pip install -e . playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test local HTTP and browser flows
        shell: bash
        env:
          OFC_BUILD_SHA: abc123d
        run: |
          set -euo pipefail
          python -m ofc_engine.hosted_preview --bind 127.0.0.1 --port 18080 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/readyz -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python scripts/smoke_hosted.py --base-url http://127.0.0.1:18080 --expected-sha abc123d
          python scripts/browser_smoke.py --base-url http://127.0.0.1:18080
          python scripts/smoke_recorded_browser.py --base-url http://127.0.0.1:18080
          python scripts/accessibility_smoke.py --base-url http://127.0.0.1:18080
          python scripts/bench_preview.py --base-url http://127.0.0.1:18080 --samples 64 --workers 4 --warmup 8
          python scripts/capture_ui.py --base-url http://127.0.0.1:18080 --output ui-review
      - name: Archive synthetic UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofc-ui-review
          path: ui-review/*.png
          if-no-files-found: ignore
          retention-days: 7
